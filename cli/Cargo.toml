[package]
name = "raster_cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "raster-cli: renders PNG frames through the Raster CRT engine, headless"

[[bin]]
name = "raster-cli"
path = "src/main.rs"

[dependencies]
raster_engine = { path = "../engine" }
png = "0.18.1"
serde_json = "1.0.154"
